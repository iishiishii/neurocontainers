name: mrireface
version: 0.3.5

copyright:
  - name: mri_reface Non-Commercial Research License
    url: https://www.nitrc.org/projects/mri_reface/

architectures:
  - x86_64

variables:
  matlab_release: R2022a
  matlab_runtime_root: /opt/matlab-runtime/v912
  niftyreg_version: "2.1.2"

auto_update:
  method: sources
  container_version: mri_reface
  sources:
    - id: mri_reface
      method: artifact_listing
      url: https://object-store.rc.nectar.org.au/v1/AUTH_dead991e1fa847e3afcca2d3a7041f5d/build?format=json&prefix=mri_reface
      version_regex: 'mri_reface_(?P<version>\d+\.\d+\.\d+)\.zip$'
      download_base: https://object-store.rc.nectar.org.au/v1/AUTH_dead991e1fa847e3afcca2d3a7041f5d/build/
      target:
        file: archive
    - id: niftyreg
      dependency: true
      method: github_tags
      repo: KCL-BMEIS/niftyreg
      version_regex: 'v(?P<version>\d+\.\d+\.\d+)'
      target:
        variable: niftyreg_version

build:
  kind: neurodocker
  base-image: ubuntu:22.04
  pkg-manager: apt

  directives:
    - run:
        - printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' > /etc/apt/apt.conf.d/80retries

    # MATLAB LD_LIBRARY_PATH is deferred to the final environment directive to avoid
    # conflicting with system curl/cmake during dependency builds.
    - environment:
        DEBIAN_FRONTEND: noninteractive
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8

    - install:
        - ca-certificates
        - curl
        - unzip
        - xvfb
        - libgomp1
        - libxt6
        - libxext6
        - libx11-6

    - template:
        name: ants
        version: "2.6.2"

    - install:
        - git
        - cmake
        - make
        - g++

    - workdir: /opt/niftyreg-{{ context.niftyreg_version }}

    - run:
        - git clone --branch v{{ context.niftyreg_version }} --depth 1 https://github.com/KCL-BMEIS/niftyreg.git src
        - cmake -S src -B build -D CMAKE_BUILD_TYPE=Release -D CMAKE_INSTALL_PREFIX=/opt/niftyreg-{{ context.niftyreg_version }}
        - cmake --build build
        - cmake --install build
        - rm -rf src build

    - run:
        - mkdir -p /opt/matlab-runtime
        - unzip {{ get_file("mcr_installer") }} -d /tmp/mcr_installer
        - /tmp/mcr_installer/install -destinationFolder /opt/matlab-runtime -agreeToLicense yes -mode silent -outputFile /tmp/mcr_install.log
        - rm -rf /tmp/mcr_installer /tmp/mcr_install.log
        - rm -f {{ context.matlab_runtime_root }}/sys/os/glnxa64/libstdc++.so.6

    - workdir: /opt/mrireface-{{ context.version }}

    - run:
        - unzip {{ get_file("archive") }} -d /tmp/mri_reface_extract
        - cp -a /tmp/mri_reface_extract/mri_reface/. /opt/mrireface-{{ context.version }}/
        - rm -rf /tmp/mri_reface_extract

    # Set MATLAB env vars last so LD_LIBRARY_PATH does not shadow system libcurl
    # during ANTs download and NiftyReg compilation above.
    - environment:
        MCRROOT: "{{ context.matlab_runtime_root }}"
        AGREE_TO_MATLAB_RUNTIME_LICENSE: "yes"
        LD_LIBRARY_PATH: >-
          {{ context.matlab_runtime_root }}:{{ context.matlab_runtime_root }}/runtime/glnxa64:{{ context.matlab_runtime_root }}/bin/glnxa64:{{ context.matlab_runtime_root }}/sys/os/glnxa64:{{ context.matlab_runtime_root }}/sys/opengl/lib/glnxa64:{{ context.matlab_runtime_root }}/extern/bin/glnxa64
        PATH: /opt/mrireface-{{ context.version }}:/opt/niftyreg-{{ context.niftyreg_version }}/bin:${PATH}
        TOOLBOX_PATH: /opt/niftyreg-{{ context.niftyreg_version }}/

deploy:
  path:
    - /opt/mrireface-{{ context.version }}
    - /opt/niftyreg-{{ context.niftyreg_version }}/bin

files:
  - name: archive
    url: https://object-store.rc.nectar.org.au/v1/AUTH_dead991e1fa847e3afcca2d3a7041f5d/build/mri_reface_0.3.5.zip
  - name: mcr_installer
    url: https://ssd.mathworks.com/supportfiles/downloads/R2022a/Release/9/deployment_files/installer/complete/glnxa64/MATLAB_Runtime_R2022a_Update_9_glnxa64.zip

domains:
  - neuroimaging
categories:
  - structural imaging

readme: |
  ----------------------------------
  ## mrireface/{{ context.version }} ##

  mri_reface replaces the facial region of head MRI, PET, and CT images with an
  average face, preventing re-identification while preserving scan quality for
  downstream analysis. Supported modalities: T1, T2, FLAIR, T2*, and ASL MRI;
  amyloid, tau, and FDG PET; and CT.

  This tool is provided for non-commercial research use only. See the license:
  https://www.nitrc.org/projects/mri_reface/

  Example:
  ```
  mri_reface -in input.nii.gz -out output.nii.gz -mode T1
  ```

  Dependencies included:
  - MATLAB Runtime {{ context.matlab_release }} (v9.12)
  - ANTs 2.6.2
  - NiftyReg {{ context.niftyreg_version }}

  More documentation: https://www.nitrc.org/projects/mri_reface/

  Citation:
  ```
  Schwarz CG, et al. (2021). Identification of Anonymous MRI Research Participants
  with Face-Recognition Software. N Engl J Med, 383(12), 1183-1184.
  doi:10.1056/NEJMc2027436
  ```

  To run applications outside of this container: ml mrireface/{{ context.version }}

  ----------------------------------

